<!doctype html>
<html lang="es" class="dark">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23000'/%3E%3Ctext x='16' y='23' font-family='system-ui,sans-serif' font-size='20' font-weight='700' fill='%23fff' text-anchor='middle'%3EV%3C/text%3E%3C/svg%3E" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Vumies - Tu plataforma favorita para ver películas y series online" />
  <meta name="color-scheme" content="dark light" />
  <title>Vumies - Películas y Series Online</title>

  <!-- Inter sin bloquear el render: se precarga y se aplica cuando llega. display=swap
       evita FOIT mientras tanto. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    media="print" onload="this.media='all'">
  <noscript>
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  </noscript>

  <!-- Resource hints para los hosts de imágenes (sin crossorigin: las imágenes se piden sin CORS). -->
  <link rel="preconnect" href="https://image.tmdb.org">
  <link rel="dns-prefetch" href="https://image.tmdb.org">
  <link rel="preconnect" href="https://api.themoviedb.org" crossorigin>
  <link rel="dns-prefetch" href="https://api.themoviedb.org">
</head>

<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
